<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p5-bg" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1a2e"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%">
      <stop stop-color="#fef08a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p5-bg)"/>
  
  <rect x="20" y="20" width="560" height="340" rx="12" fill="#081424" stroke="#1e3a5f" stroke-width="1.5"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="44" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">SkyPulse Weather &amp; Air Quality</text>

  <!-- Weather Hero Card -->
  <rect x="35" y="70" width="310" height="150" rx="10" fill="#0c1e36" stroke="#1e3a5f" stroke-width="1"/>
  <text x="50" y="98" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Lahore, Pakistan</text>
  <text x="50" y="115" font-family="sans-serif" font-size="10" fill="#94a3b8">Updated 5 mins ago</text>
  <text x="50" y="165" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff">26°C</text>
  <text x="50" y="185" font-family="sans-serif" font-size="12" fill="#38bdf8">Sunny &amp; Clear • Humidity 42%</text>

  <!-- Sun Graphic -->
  <circle cx="280" cy="130" r="32" fill="url(#sun-grad)"/>
  <path d="M280 85 L280 95 M280 165 L280 175 M235 130 L245 130 M315 130 L325 130" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Radar / Air Quality Card -->
  <rect x="365" y="70" width="200" height="150" rx="10" fill="#0c1e36" stroke="#1e3a5f" stroke-width="1"/>
  <text x="380" y="98" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Air Quality Index (AQI)</text>
  <circle cx="465" cy="150" r="38" fill="none" stroke="#334155" stroke-width="8"/>
  <circle cx="465" cy="150" r="38" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="160 80"/>
  <text x="453" y="156" font-family="sans-serif" font-size="18" font-weight="bold" fill="#10b981">48</text>
  <text x="445" y="172" font-family="sans-serif" font-size="9" fill="#94a3b8">Good Air</text>

  <!-- 5-Day Forecast -->
  <rect x="35" y="235" width="530" height="110" rx="10" fill="#0c1e36" stroke="#1e3a5f" stroke-width="1"/>
  <text x="50" y="258" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1">5-Day Hourly Forecast</text>
  
  <rect x="50" y="270" width="90" height="60" rx="6" fill="#132742"/>
  <text x="65" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">Mon</text>
  <text x="65" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">27°</text>

  <rect x="155" y="270" width="90" height="60" rx="6" fill="#132742"/>
  <text x="170" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">Tue</text>
  <text x="170" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">29°</text>

  <rect x="260" y="270" width="90" height="60" rx="6" fill="#132742"/>
  <text x="275" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">Wed</text>
  <text x="275" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">25°</text>

  <rect x="365" y="270" width="90" height="60" rx="6" fill="#132742"/>
  <text x="380" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">Thu</text>
  <text x="380" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">24°</text>

  <rect x="470" y="270" width="85" height="60" rx="6" fill="#132742"/>
  <text x="485" y="290" font-family="sans-serif" font-size="10" fill="#94a3b8">Fri</text>
  <text x="485" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">28°</text>
</svg>

