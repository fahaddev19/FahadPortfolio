<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="p3-grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p3-bg)"/>
  
  <rect x="20" y="20" width="560" height="340" rx="12" fill="#18112c" stroke="#3b2d54" stroke-width="1.5"/>
  <circle cx="45" cy="40" r="5" fill="#ef4444"/>
  <circle cx="62" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="44" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c084fc">OmniAI Studio - Multi-LLM Playground</text>

  <!-- Left Model Selector -->
  <rect x="35" y="70" width="140" height="275" rx="8" fill="#100b1e"/>
  <text x="47" y="95" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a855f7">Model Engine</text>
  <rect x="45" y="110" width="120" height="32" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
  <text x="55" y="130" font-family="sans-serif" font-size="10" font-weight="bold" fill="#e9d5ff">GPT-4o / Claude</text>

  <rect x="45" y="150" width="120" height="32" rx="6" fill="#1e1533"/>
  <text x="55" y="170" font-family="sans-serif" font-size="10" fill="#a78bfa">Gemini 1.5 Pro</text>

  <text x="47" y="210" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">Temperature: 0.7</text>
  <rect x="47" y="222" width="116" height="4" rx="2" fill="#3b2d54"/>
  <circle cx="120" cy="224" r="6" fill="#c084fc"/>

  <text x="47" y="250" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">Max Tokens: 4096</text>
  <rect x="47" y="262" width="116" height="4" rx="2" fill="#3b2d54"/>
  <circle cx="140" cy="264" r="6" fill="#c084fc"/>

  <!-- Chat Area -->
  <rect x="190" y="70" width="375" height="225" rx="8" fill="#100b1e"/>
  <!-- User message -->
  <rect x="290" y="90" width="260" height="40" rx="12" fill="#3b82f6"/>
  <text x="305" y="114" font-family="sans-serif" font-size="11" fill="#ffffff">Generate a responsive CSS Grid layout</text>

  <!-- AI message -->
  <rect x="205" y="145" width="345" height="135" rx="12" fill="#1f1837" stroke="#3b2d54" stroke-width="1"/>
  <circle cx="225" cy="165" r="10" fill="url(#p3-grad)"/>
  <text x="221" y="169" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold">AI</text>
  <text x="245" y="169" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c084fc">Assistant</text>
  <text x="225" y="195" font-family="sans-serif" font-size="11" fill="#cbd5e1">Here is a modern responsive CSS Grid layout</text>
  <text x="225" y="212" font-family="sans-serif" font-size="11" fill="#cbd5e1">with auto-fitting columns:</text>
  <rect x="225" y="225" width="305" height="40" rx="6" fill="#0d0818"/>
  <text x="235" y="248" font-family="monospace" font-size="10" fill="#38bdf8">grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));</text>

  <!-- Input Area -->
  <rect x="190" y="305" width="375" height="40" rx="8" fill="#1e1533" stroke="#3b2d54" stroke-width="1"/>
  <text x="205" y="329" font-family="sans-serif" font-size="11" fill="#64748b">Type your prompt here...</text>
  <rect x="515" y="311" width="42" height="28" rx="6" fill="url(#p3-grad)"/>
  <path d="M532 320 L540 325 L532 330" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
